<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open-source AI Opportunity · 2026-08-10</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(1120px,calc(100% - 28px));margin:auto;padding:40px 0 70px}header,.card,footer,.summary div{background:#fff;border-radius:24px;padding:24px}h1{font-size:52px;margin:10px 0}small,label{color:#6e6e73;font-size:12px;font-weight:800}.summary,.grid{display:grid;gap:16px}.summary{grid-template-columns:repeat(3,1fr);margin:16px 0 30px}.grid{grid-template-columns:repeat(2,1fr)}.top{display:flex;gap:12px;justify-content:space-between}.top b{background:#111;color:#fff;border-radius:10px;padding:8px}.chips span{display:inline-block;background:#eee;border-radius:99px;padding:4px 8px;margin:4px 4px 0 0;font-size:12px}section{border-top:1px solid #eee;margin-top:14px;padding-top:14px}section.value,section.action{border:0;border-radius:16px;padding:14px}.value{background:#f5f5f7}.action{background:#eef6ff}.links{margin-top:16px}.links a,.links button{border:0;border-radius:99px;padding:8px 11px;margin-right:6px}.links a{background:#eee;color:#06c;text-decoration:none}footer{margin-top:28px}@media(max-width:800px){.summary,.grid{grid-template-columns:1fr}h1{font-size:38px}}</style></head><body><main><header><small>VALUE-FIRST · V1.5 · 2026-08-10</small><h1>Open-source AI Opportunity</h1><p id="mission"></p></header><div class="summary" id="summary"></div><div class="grid" id="grid"></div><footer><small>REJECTED CANDIDATES</small><ul id="rejected"></ul></footer></main><script>const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));fetch('../../data/daily/2026-08-10.json').then(r=>r.json()).then(d=>{mission.textContent=d.today_mission;summary.innerHTML=d.summary.map(x=>`<div>${esc(x)}</div>`).join('');grid.innerHTML=d.projects.map(p=>`<article class="card"><div class="top"><b>#${p.rank}</b><div><h2>${esc(p.name)}</h2><div class="chips">${p.category.map(c=>`<span>${esc(c)}</span>`).join('')}</div></div><strong>${p.score}</strong></div><section class="value"><label>核心判断</label><p>${esc(p.value_insight)}</p></section><section><label>解决的问题</label><p>${esc(p.problem_solved)}</p></section><section><label>主流方案对比</label><p>${esc(p.mainstream_comparison)}</p></section><section class="action"><label>今天可以做</label><p>${esc(p.today_action)}</p></section><section><label>后续机会</label><p>${esc(p.next_opportunity)}</p></section><div class="links"><a href="${esc(p.github)}" target="_blank" rel="noopener">GitHub</a><button type="button">待验证</button></div></article>`).join('');rejected.innerHTML=d.rejected_candidates.map(x=>`<li><b>${esc(x.name)}</b>：${esc(x.reason)}</li>`).join('')}).catch(e=>{mission.textContent='日报加载失败：'+e.message})</script></body></html>
